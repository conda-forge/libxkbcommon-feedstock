{% set name = "libxkbcommon" %}
{% set version = "1.13.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/xkbcommon/{{ name }}/archive/xkbcommon-{{ version }}.tar.gz
  sha256: acc4d5f7c3cbba5f9f8d08d8bdbeede84ecede46792f47929aa9321873385528

build:
  number: 0
  skip: true  # [win or osx]
  missing_dso_whitelist:
    - /lib/libc.so.6
  run_exports:
    - {{ pin_subpackage('libxkbcommon') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - meson
    - ninja
    - m4
    - bison
    - cmake
    - pkg-config
  host:
    - xorg-libxau
    - libxcb
    - xorg-xproto
    - xcb-proto
    - pthread-stubs
    - libxml2-devel
    # Needed at build time since 1.13.2: meson probes xkeyboard-config's
    # pkg-config to derive the default XKB config root and the (un)versioned
    # extensions paths. Without it those DFLT_XKB_CONFIG_*_EXTENSIONS_PATH
    # macros are left undefined, and tools/info.c references them unguarded
    # (upstream uses #ifdef everywhere else), failing the build. Having it in
    # host also bakes the correct $PREFIX/share/X11/xkb config root instead of
    # the /usr legacy fallback.
    - xkeyboard-config
  run:
    - xkeyboard-config

test:
  commands:
    - test -f "${PREFIX}/lib/libxkbcommon${SHLIB_EXT}"
    - xkbcli --help

about:
  home: https://github.com/xkbcommon/libxkbcommon
  license: MIT/X11 Derivative
  license_family: MIT
  license_file: LICENSE
  summary: keymap handling library for toolkits and window systems
  description: |
    libxkbcommon is a keyboard keymap compiler and support library which
    processes a reduced subset of keymaps as defined by the XKB (X Keyboard
    Extension) specification.
  doc_url: https://xkbcommon.org/
  dev_url: https://github.com/xkbcommon/libxkbcommon

extra:
  recipe-maintainers:
    - scopatz
    - hmaarrfk
